<!doctype html>
<html lang="en" data-theme="light" data-accent="berry">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kaasu</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Apply the saved theme before first paint (see AppearanceSync.tsx)
      try {
        const saved = JSON.parse(localStorage.getItem("kaasu-appearance") || "null")
        const theme = saved?.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        document.documentElement.dataset.theme = theme
        if (saved?.accent) document.documentElement.dataset.accent = saved.accent
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
